    <script>
      (function() {
        try {
          var currentFetch = window.fetch;
          Object.defineProperty(window, 'fetch', {
            configurable: true,
            enumerable: true,
            get: function() {
              return currentFetch;
            },
            set: function(fn) {
              currentFetch = fn;
            }
          });
        } catch (e) {
          try {
            var proto = Object.getPrototypeOf(window) || (typeof Window !== 'undefined' && Window.prototype);
            if (proto) {
              var protoFetch = proto.fetch || window.fetch;
              Object.defineProperty(proto, 'fetch', {
                configurable: true,
                enumerable: true,
                get: function() {
                  return protoFetch;
                },
                set: function(fn) {
                  protoFetch = fn;
                }
              });
            }
          } catch (err) {}
        }
      })();
    </script>
    <title>Superstition Mountains: Lost Dutchman Expedition</title>
    <meta name="description" content="A 3D open-world desert survival exploration game in Arizona's Superstition Wilderness with voiced historic Tortilla Flat townfolk NPCs, dynamic desert hydrology, flash floods, wilderness camping, real-time multiplayer, and underground mining." />
    <meta property="og:title" content="Superstition Mountains: Lost Dutchman Expedition" />
    <meta property="og:description" content="A 3D open-world desert survival exploration game in Arizona's Superstition Wilderness with voiced historic Tortilla Flat townfolk NPCs, dynamic desert hydrology, flash floods, wilderness camping, real-time multiplayer, and underground mining." />

    <style>
      html, body, #root {
        width: 100%;
        height: 100%;
        margin: 0;
        padding: 0;
        overflow: hidden;
        position: fixed;
        inset: 0;
        background-color: #0c0a09;
        -webkit-font-smoothing: antialiased;
      }
      :fullscreen, :-webkit-full-screen, :-moz-full-screen {
        width: 100% !important;
        height: 100% !important;
        overflow: hidden !important;
      }
      canvas {
        display: block;
        width: 100% !important;
        height: 100% !important;
        image-rendering: auto;
        touch-action: none;
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div style="display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;background:#0c0a09;color:#e7e5e4;font-family:ui-serif,Georgia,serif;text-align:center;padding:1.5rem;box-sizing:border-box;">
        <div style="width:4.5rem;height:4.5rem;border-radius:1rem;background:#45220c;border:2px solid #b45309;display:flex;align-items:center;justify-content:center;margin-bottom:1.25rem;box-shadow:0 10px 25px rgba(0,0,0,0.5);">
          <span style="font-size:2.2rem;display:inline-block;animation:pulse 1.8s infinite ease-in-out;">⛰️</span>
        </div>
        <div style="font-family:ui-monospace,monospace;font-size:0.7rem;letter-spacing:0.25em;color:#f59e0b;font-weight:700;text-transform:uppercase;margin-bottom:0.35rem;">
          Superstition Wilderness
        </div>
        <h1 style="font-size:1.6rem;font-weight:700;color:#fef3c7;margin:0 0 0.5rem 0;letter-spacing:0.02em;">
          The Lost Dutchman Gold
        </h1>
        <p style="font-family:ui-sans-serif,system-ui,sans-serif;font-size:0.85rem;color:#a8a29e;max-width:24rem;margin:0 0 1.5rem 0;line-height:1.4;">
          Loading 3D desert topography, mountain tunnels, and prospector camp...
        </p>
        <div style="display:flex;align-items:center;gap:0.5rem;">
          <div style="width:1.5rem;height:1.5rem;border:3px solid #78350f;border-top-color:#f59e0b;border-radius:50%;animation:spin 0.9s linear infinite;"></div>
          <span style="font-family:ui-sans-serif,system-ui,sans-serif;font-size:0.75rem;color:#78716c;">Initializing expedition engine</span>
        </div>
        <style>
          @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
          @keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.08); } }
        </style>
      </div>
    </div>
    <script>
      (function() {
        // Immediate Fullscreen Bootstrapper: Attempts fullscreen on load, with first-gesture fallback
        function tryImmediateFullscreen() {
          try {
            var docEl = document.documentElement;
            var req = docEl.requestFullscreen || docEl.webkitRequestFullscreen || docEl.mozRequestFullScreen || docEl.msRequestFullscreen;
            if (req && !document.fullscreenElement && !document.webkitFullscreenElement) {
              var p = req.call(docEl, { navigationUI: 'hide' });
              if (p && p.catch) p.catch(function() {});
            }
          } catch (e) {}
        }
        // Try immediately
        tryImmediateFullscreen();
        window.addEventListener('load', tryImmediateFullscreen);
        // And on the very first touch / click / key
        function onEarlyGesture() {
          tryImmediateFullscreen();
          window.removeEventListener('pointerdown', onEarlyGesture, true);
          window.removeEventListener('keydown', onEarlyGesture, true);
          window.removeEventListener('touchstart', onEarlyGesture, true);
        }
        window.addEventListener('pointerdown', onEarlyGesture, { capture: true, once: true });
        window.addEventListener('keydown', onEarlyGesture, { capture: true, once: true });
        window.addEventListener('touchstart', onEarlyGesture, { capture: true, once: true });
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
